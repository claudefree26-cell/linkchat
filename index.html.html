<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LinkChat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0a0d14;
    --bg-panel:#10141f;
    --bg-elevated:#161b29;
    --line:#232a3d;
    --accent1:#7c5cfc;
    --accent2:#22d3ee;
    --text:#e7e9f0;
    --text-dim:#8890a6;
    --ok:#3ddc97;
    --err:#ff5c7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,92,252,0.14), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(34,211,238,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .mono{font-family:'Consolas','SFMono-Regular',Menlo,monospace;}

  /* ---------- TOPBAR ---------- */
  header{
    display:flex; align-items:center; gap:10px;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
    background:rgba(16,20,31,0.6);
    backdrop-filter:blur(8px);
    flex-shrink:0;
  }
  .logo-dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 0 12px rgba(124,92,252,0.7);
  }
  header h1{font-size:16px; letter-spacing:0.5px; font-weight:600;}
  header h1 span{color:var(--accent2);}
  .status-pill{
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
    padding:5px 10px; border:1px solid var(--line); border-radius:20px;
  }
  .status-pill .led{width:7px;height:7px;border-radius:50%; background:var(--text-dim);}
  .status-pill.online .led{background:var(--ok); box-shadow:0 0 8px var(--ok);}
  .status-pill.online{color:var(--ok); border-color:rgba(61,220,151,0.3);}

  /* ---------- LOBBY ---------- */
  #lobby{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow-y:auto;
  }
  .card{
    width:100%; max-width:420px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 26px;
  }
  .card h2{font-size:20px; margin-bottom:6px;}
  .card p.sub{color:var(--text-dim); font-size:13px; margin-bottom:22px; line-height:1.5;}
  .my-id-box{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:18px;
  }
  .my-id-box .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .id-row{display:flex; align-items:center; gap:8px;}
  .id-row .code{
    font-size:20px; font-weight:700; letter-spacing:2px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    flex:1; word-break:break-all;
  }
  .icon-btn{
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); width:34px; height:34px; border-radius:8px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:0.15s;
  }
  .icon-btn:hover{border-color:var(--accent2); color:var(--accent2);}
  .divider{
    display:flex; align-items:center; gap:10px;
    color:var(--text-dim); font-size:11px; text-transform:uppercase;
    letter-spacing:1px; margin:18px 0;
  }
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}
  input[type=text]{
    width:100%; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); padding:13px 14px; border-radius:10px; font-size:15px;
    outline:none; transition:0.15s;
  }
  input[type=text]:focus{border-color:var(--accent1);}
  input[type=text]::placeholder{color:var(--text-dim);}
  button.primary{
    width:100%; margin-top:12px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    border:none; color:#0a0d14; font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; cursor:pointer;
    transition:0.15s; letter-spacing:0.3px;
  }
  button.primary:hover{opacity:0.9; transform:translateY(-1px);}
  button.primary:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  #lobby-msg{font-size:12.5px; margin-top:12px; text-align:center; min-height:16px;}
  #lobby-msg.err{color:var(--err);}
  #lobby-msg.ok{color:var(--ok);}

  /* ---------- CHAT ---------- */
  #chat{flex:1; display:none; flex-direction:column; min-height:0;}
  #messages{
    flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;
  }
  .bubble{
    max-width:75%; padding:10px 14px; border-radius:14px; font-size:14.5px; line-height:1.4;
    word-wrap:break-word; white-space:pre-wrap;
  }
  .bubble.me{
    align-self:flex-end;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#0a0d14; font-weight:500;
    border-bottom-right-radius:4px;
  }
  .bubble.them{
    align-self:flex-start;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.sys{
    align-self:center; background:transparent; color:var(--text-dim);
    font-size:12px; padding:4px;
  }
  .time{font-size:10px; opacity:0.6; margin-top:3px; display:block;}
  #composer{
    display:flex; gap:10px; padding:14px; border-top:1px solid var(--line);
    background:rgba(16,20,31,0.6); flex-shrink:0;
  }
  #msgInput{
    flex:1; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); padding:12px 16px; border-radius:24px; font-size:15px; outline:none;
  }
  #msgInput:focus{border-color:var(--accent1);}
  #sendBtn{
    width:46px; height:46px; border-radius:50%; border:none; flex-shrink:0;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#0a0d14; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:hover{opacity:0.9;}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>Link<span>Chat</span></h1>
  <div class="status-pill" id="statusPill"><span class="led"></span><span id="statusText">desconectado</span></div>
</header>

<div id="lobby">
  <div class="card">
    <h2>Conectar com alguém</h2>
    <p class="sub">Compartilhe seu código com a outra pessoa, ou cole o código dela abaixo para entrar direto na conversa. Sem cadastro, sem servidor — a conversa vai direto de um dispositivo pro outro.</p>

    <div class="my-id-box">
      <div class="label">Seu código</div>
      <div class="id-row">
        <div class="code mono" id="myId">gerando...</div>
        <button class="icon-btn" id="copyBtn" title="Copiar código">⧉</button>
      </div>
    </div>

    <div class="divider">ou entre com um código</div>

    <input type="text" id="joinInput" placeholder="Cole o código da outra pessoa aqui" class="mono" autocomplete="off">
    <button class="primary" id="joinBtn">Conectar</button>
    <div id="lobby-msg"></div>
  </div>
</div>

<div id="chat">
  <div id="messages"></div>
  <div id="composer">
    <input type="text" id="msgInput" placeholder="Digite uma mensagem..." autocomplete="off">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
  const statusPill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const myIdEl = document.getElementById('myId');
  const copyBtn = document.getElementById('copyBtn');
  const joinInput = document.getElementById('joinInput');
  const joinBtn = document.getElementById('joinBtn');
  const lobbyMsg = document.getElementById('lobby-msg');
  const lobby = document.getElementById('lobby');
  const chatEl = document.getElementById('chat');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  let peer = null;
  let conn = null;

  function shortId(){
    // gera um código curto e fácil de digitar, tipo "AB12-CD34"
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for(let i=0;i<8;i++){
      if(i===4) s+='-';
      s += chars[Math.floor(Math.random()*chars.length)];
    }
    return 'lc-' + s;
  }

  function setStatus(online, text){
    statusText.textContent = text;
    statusPill.classList.toggle('online', online);
  }

  function initPeer(){
    const id = shortId();
    peer = new Peer(id, {debug:1});

    peer.on('open', (id)=>{
      myIdEl.textContent = id;
    });

    peer.on('connection', (c)=>{
      conn = c;
      setupConnection();
    });

    peer.on('error', (err)=>{
      console.error(err);
      if(err.type === 'peer-unavailable'){
        showLobbyMsg('Código não encontrado. Confira se digitou certo e se a outra pessoa está com a página aberta.', 'err');
        joinBtn.disabled = false;
        joinBtn.textContent = 'Conectar';
      } else if(err.type === 'unavailable-id'){
        setTimeout(initPeer, 500);
      }
    });
  }

  function showLobbyMsg(text, type){
    lobbyMsg.textContent = text;
    lobbyMsg.className = type || '';
  }

  copyBtn.addEventListener('click', ()=>{
    navigator.clipboard.writeText(myIdEl.textContent).then(()=>{
      copyBtn.textContent = '✓';
      setTimeout(()=>copyBtn.textContent='⧉', 1200);
    });
  });

  joinBtn.addEventListener('click', ()=>{
    const targetId = joinInput.value.trim();
    if(!targetId){ showLobbyMsg('Cole um código antes de conectar.', 'err'); return; }
    joinBtn.disabled = true;
    joinBtn.textContent = 'Conectando...';
    showLobbyMsg('Tentando conectar...', '');
    conn = peer.connect(targetId, {reliable:true});
    conn.on('open', ()=>{ setupConnection(); });
    conn.on('error', (e)=>{
      showLobbyMsg('Falha ao conectar. Tente de novo.', 'err');
      joinBtn.disabled = false;
      joinBtn.textContent = 'Conectar';
    });
  });

  joinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') joinBtn.click(); });

  function setupConnection(){
    lobby.style.display = 'none';
    chatEl.style.display = 'flex';
    setStatus(true, 'conectado');
    addSystemMsg('Vocês estão conectados. A conversa é direta entre os dois dispositivos.');

    conn.on('data', (data)=>{
      addBubble(data, 'them');
    });

    conn.on('close', ()=>{
      setStatus(false, 'desconectado');
      addSystemMsg('A outra pessoa saiu da conversa.');
    });
  }

  function addBubble(text, who){
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    const now = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
    b.innerHTML = escapeHtml(text) + '<span class="time">'+time+'</span>';
    messagesEl.appendChild(b);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemMsg(text){
    const b = document.createElement('div');
    b.className = 'bubble sys';
    b.textContent = text;
    messagesEl.appendChild(b);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || !conn || !conn.open) return;
    conn.send(text);
    addBubble(text, 'me');
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });

  initPeer();
</script>

</body>
</html>
