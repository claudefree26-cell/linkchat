<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>LinkChat</title>
<style>
  :root{
    --bg:#0a0d14;
    --bg-panel:#10141f;
    --bg-elevated:#161b29;
    --line:#232a3d;
    --accent1:#7c5cfc;
    --accent2:#22d3ee;
    --text:#e7e9f0;
    --text-dim:#8890a6;
    --ok:#3ddc97;
    --err:#ff5c7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(124,92,252,0.14), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(34,211,238,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .mono{font-family:'Consolas','SFMono-Regular',Menlo,monospace;}

  /* header original fica escondido — o app agora não tem cabeçalho pesado */
  header{display:none;}

  .logo-dot{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 0 12px rgba(124,92,252,0.7);
  }

  #lobby{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow-y:auto;
  }
  .card{
    width:100%; max-width:420px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 26px;
  }
  .card h2{font-size:20px; margin-bottom:6px;}
  .card p.sub{color:var(--text-dim); font-size:13px; margin-bottom:22px; line-height:1.5;}
  .my-id-box{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:18px;
  }
  .my-id-box .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .id-row{display:flex; align-items:center; gap:8px;}
  .id-row .code{
    font-size:20px; font-weight:700; letter-spacing:2px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    flex:1; word-break:break-all;
  }
  .icon-btn{
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); width:34px; height:34px; border-radius:8px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:0.15s;
  }
  .icon-btn:hover{border-color:var(--accent2); color:var(--accent2);}
  .divider{
    display:flex; align-items:center; gap:10px;
    color:var(--text-dim); font-size:11px; text-transform:uppercase;
    letter-spacing:1px; margin:18px 0;
  }
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}
  input[type=text]{
    width:100%; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); padding:13px 14px; border-radius:10px; font-size:15px;
    outline:none; transition:0.15s;
  }
  input[type=text]:focus{border-color:var(--accent1);}
  input[type=text]::placeholder{color:var(--text-dim);}
  button.primary{
    width:100%; margin-top:12px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    border:none; color:#0a0d14; font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; cursor:pointer;
    transition:0.15s; letter-spacing:0.3px;
  }
  button.primary:hover{opacity:0.9; transform:translateY(-1px);}
  button.primary:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  #lobby-msg{font-size:12.5px; margin-top:12px; text-align:center; min-height:16px;}
  #lobby-msg.err{color:var(--err);}
  #lobby-msg.ok{color:var(--ok);}

  #chat{flex:1; display:none; flex-direction:column; min-height:0; position:relative;}

  /* status agora é só um pontinho discreto no canto, sem a pílula de texto */
  #statusDot{
    position:absolute; top:8px; right:12px; z-index:2;
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim);
  }
  #statusDot.online{background:var(--ok); box-shadow:0 0 6px var(--ok);}

  #messages{
    flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;
  }
  .bubble{
    max-width:78%;
    padding:0.55em 0.8em;
    border-radius:0.9em;
    font-size:0.95rem;
    line-height:1.4; word-wrap:break-word; white-space:pre-wrap;
  }
  .sender-name{
    font-size:0.68rem;
    font-weight:700;
    margin-bottom:0.2em;
    opacity:0.75;
    letter-spacing:0.2px;
  }
  .bubble.me .sender-name{color:rgba(10,13,20,0.65);}
  .bubble.them .sender-name{color:var(--accent2);}
  .bubble.me{
    align-self:flex-end;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#0a0d14; font-weight:500;
    border-bottom-right-radius:4px;
  }
  .bubble.them{
    align-self:flex-start;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.sys{
    align-self:center; background:transparent; color:var(--text-dim);
    font-size:12px; padding:4px;
  }
  .time{font-size:0.62rem; opacity:0.6; margin-top:0.25em; display:block;}

  #composer{
    display:flex; gap:0.6em;
    padding:0.7em;
    border-top:1px solid var(--line);
    background:rgba(16,20,31,0.6); flex-shrink:0;
  }
  #msgInput{
    flex:1; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text);
    padding:0.65em 0.9em;
    border-radius:1.6em;
    font-size:0.95rem;
    outline:none;
    min-width:0;
  }
  #msgInput:focus{border-color:var(--accent1);}
  #sendBtn, #leaveBtn{
    width:2.6em; height:2.6em;
    font-size:1rem;
    border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #sendBtn{
    border:none;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#0a0d14; cursor:pointer;
  }
  #sendBtn:hover{opacity:0.9;}
  #leaveBtn{
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text-dim); cursor:pointer;
  }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .name-field{margin-bottom:14px;}
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>Link<span>Chat</span></h1>
  <div class="status-pill" id="statusPill"><span class="led"></span><span id="statusText">desconectado</span></div>
</header>

<div id="lobby">
  <div class="card">
    <h2>Conectar com alguém</h2>
    <p class="sub">Crie uma sala e compartilhe o código com a outra pessoa, ou cole o código dela abaixo para entrar direto na conversa.</p>

    <div class="name-field">
      <input type="text" id="nameInput" placeholder="Seu nome" autocomplete="off" maxlength="20">
    </div>

    <div class="my-id-box">
      <div class="label">Sua sala</div>
      <div class="id-row">
        <div class="code mono" id="myId">toque em criar</div>
        <button class="icon-btn" id="copyBtn" title="Copiar código">⧉</button>
      </div>
    </div>
    <button class="primary" id="createBtn" style="background:var(--bg-elevated); color:var(--text); border:1px solid var(--line);">Criar nova sala</button>

    <div class="divider">ou entre com um código</div>

    <input type="text" id="joinInput" placeholder="Cole o código da outra pessoa aqui" class="mono" autocomplete="off">
    <button class="primary" id="joinBtn">Conectar</button>
    <div id="lobby-msg"></div>
  </div>
</div>

<div id="chat">
  <div id="statusDot"></div>
  <div id="messages"></div>
  <div id="composer">
    <button id="leaveBtn" title="Sair da sala">←</button>
    <input type="text" id="msgInput" placeholder="Digite uma mensagem..." autocomplete="off">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy,
    onSnapshot, serverTimestamp, doc, setDoc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBPu8k092E2szSImoMMgi7s6W_qjlBvv2A",
    authDomain: "linkchat-b1007.firebaseapp.com",
    projectId: "linkchat-b1007",
    storageBucket: "linkchat-b1007.firebasestorage.app",
    messagingSenderId: "435176237595",
    appId: "1:435176237595:web:f1d8cdb4ba9e1cb53c26be"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const statusDot = document.getElementById('statusDot');
  const nameInput = document.getElementById('nameInput');
  const myIdEl = document.getElementById('myId');
  const copyBtn = document.getElementById('copyBtn');
  const createBtn = document.getElementById('createBtn');
  const joinInput = document.getElementById('joinInput');
  const joinBtn = document.getElementById('joinBtn');
  const lobbyMsg = document.getElementById('lobby-msg');
  const lobby = document.getElementById('lobby');
  const chatEl = document.getElementById('chat');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const leaveBtn = document.getElementById('leaveBtn');

  const mySenderId = 'u-' + Math.random().toString(36).slice(2, 10);
  let roomCode = null;
  let unsubscribe = null;
  let meuNome = '';

  // ---------- escala dinâmica de texto ----------
  // em vez de vw/clamp (que não reage ao tamanho real do painel dentro do
  // app Android), medimos o tamanho real do documento e ajustamos o
  // font-size da raiz. Tudo que usa rem/em escala junto automaticamente.
  function ajustarEscala(){
    const largura = document.documentElement.clientWidth || window.innerWidth;
    const min = 170, max = 430;      // faixa de largura esperada do painel
    const fonteMin = 10.5, fonteMax = 16; // faixa de tamanho de fonte em px
    const w = Math.max(min, Math.min(max, largura));
    const fonte = fonteMin + (fonteMax - fonteMin) * (w - min) / (max - min);
    document.documentElement.style.fontSize = fonte.toFixed(2) + 'px';
  }
  ajustarEscala();
  window.addEventListener('resize', ajustarEscala);
  if(window.ResizeObserver){
    new ResizeObserver(ajustarEscala).observe(document.documentElement);
  }

  function shortCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for(let i=0;i<8;i++){
      if(i===4) s+='-';
      s += chars[Math.floor(Math.random()*chars.length)];
    }
    return 'lc-' + s;
  }

  function setStatus(online, text){
    statusDot.classList.toggle('online', online);
    statusDot.title = text; // aparece só ao passar o mouse/dedo por cima
  }

  function showLobbyMsg(text, type){
    lobbyMsg.textContent = text;
    lobbyMsg.className = type || '';
  }

  function nomeValido(){
    const nome = nameInput.value.trim();
    if(!nome){
      showLobbyMsg('Digite seu nome antes de continuar.', 'err');
      nameInput.focus();
      return false;
    }
    meuNome = nome;
    return true;
  }

  createBtn.addEventListener('click', async ()=>{
    if(!nomeValido()) return;
    const code = shortCode();
    createBtn.disabled = true;
    createBtn.textContent = 'Criando...';
    try{
      await setDoc(doc(db, 'rooms', code), { createdAt: serverTimestamp() });
      myIdEl.textContent = code;
      entrarNaSala(code);
      showLobbyMsg('Sala criada! Compartilhe o código acima.', 'ok');
    }catch(e){
      console.error(e);
      showLobbyMsg('Erro ao criar sala. Verifique sua internet.', 'err');
    }
    createBtn.disabled = false;
    createBtn.textContent = 'Criar nova sala';
  });

  copyBtn.addEventListener('click', ()=>{
    const codigo = myIdEl.textContent;
    if(codigo === 'toque em criar') return;
    navigator.clipboard.writeText(codigo).then(()=>{
      copyBtn.textContent = '✓';
      setTimeout(()=>copyBtn.textContent='⧉', 1200);
    });
  });

  joinBtn.addEventListener('click', async ()=>{
    if(!nomeValido()) return;
    const targetCode = joinInput.value.trim();
    if(!targetCode){ showLobbyMsg('Cole um código antes de conectar.', 'err'); return; }
    joinBtn.disabled = true;
    joinBtn.textContent = 'Conectando...';
    showLobbyMsg('Verificando sala...', '');
    try{
      const roomRef = doc(db, 'rooms', targetCode);
      const snap = await getDoc(roomRef);
      if(!snap.exists()){
        showLobbyMsg('Sala não encontrada. Confira o código.', 'err');
        joinBtn.disabled = false;
        joinBtn.textContent = 'Conectar';
        return;
      }
      entrarNaSala(targetCode);
    }catch(e){
      console.error(e);
      showLobbyMsg('Erro ao conectar. Verifique sua internet.', 'err');
      joinBtn.disabled = false;
      joinBtn.textContent = 'Conectar';
    }
  });

  joinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') joinBtn.click(); });

  function entrarNaSala(code){
    roomCode = code;
    lobby.style.display = 'none';
    chatEl.style.display = 'flex';
    setStatus(true, 'conectado');
    messagesEl.innerHTML = '';
    addSystemMsg('Você entrou na sala ' + code);

    const messagesRef = collection(db, 'rooms', code, 'messages');
    const q = query(messagesRef, orderBy('createdAt', 'asc'));

    unsubscribe = onSnapshot(q, (snapshot)=>{
      messagesEl.querySelectorAll('.bubble.me, .bubble.them').forEach(b => b.remove());
      snapshot.forEach((docSnap)=>{
        const data = docSnap.data();
        const who = data.sender === mySenderId ? 'me' : 'them';
        addBubble(data.text, who, data.createdAt, data.senderName);
      });
    }, (error)=>{
      console.error(error);
      addSystemMsg('Conexão perdida. Verifique sua internet.');
    });
  }

  function sairDaSala(){
    if(unsubscribe) unsubscribe();
    roomCode = null;
    chatEl.style.display = 'none';
    lobby.style.display = 'flex';
    setStatus(false, 'desconectado');
    joinInput.value = '';
    showLobbyMsg('', '');
  }

  leaveBtn.addEventListener('click', sairDaSala);

  function addBubble(text, who, timestamp, senderName){
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    let time = '';
    if(timestamp && timestamp.toDate){
      const d = timestamp.toDate();
      time = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }
    const nomeExibido = who === 'me' ? 'Você' : (senderName || 'Anônimo');
    b.innerHTML =
      '<span class="sender-name">' + escapeHtml(nomeExibido) + '</span>' +
      escapeHtml(text) +
      (time ? '<span class="time">'+time+'</span>' : '');
    messagesEl.appendChild(b);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemMsg(text){
    const b = document.createElement('div');
    b.className = 'bubble sys';
    b.textContent = text;
    messagesEl.appendChild(b);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || !roomCode) return;
    msgInput.value = '';
    try{
      const messagesRef = collection(db, 'rooms', roomCode, 'messages');
      await addDoc(messagesRef, {
        text: text,
        sender: mySenderId,
        senderName: meuNome,
        createdAt: serverTimestamp()
      });
    }catch(e){
      console.error(e);
      addSystemMsg('Falha ao enviar. Verifique sua internet.');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });
</script>

</body>
</html>
