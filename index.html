    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    backdrop-filter: blur(var(--panel-blur));
    -webkit-backdrop-filter: blur(var(--panel-blur));
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .mono{font-family:'Consolas','SFMono-Regular',Menlo,monospace;}

  /* header original fica escondido — o app agora não tem cabeçalho pesado */
  header{display:none;}

  .logo-dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px rgba(var(--accent-rgb),0.7);
  }

  #lobby{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:24px; overflow-y:auto;
  }
  .card{
    width:100%; max-width:420px;
    background:rgba(var(--bg-rgb), var(--panel-alpha));
    backdrop-filter: blur(var(--panel-blur));
    -webkit-backdrop-filter: blur(var(--panel-blur));
    border:1px solid var(--line);
    border-radius:16px;
    padding:28px 26px;
  }
  .card h2{font-size:20px; margin-bottom:6px;}
  .card p.sub{color:var(--text-dim); font-size:13px; margin-bottom:22px; line-height:1.5;}
  .my-id-box{
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:18px;
  }
  .my-id-box .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .id-row{display:flex; align-items:center; gap:8px;}
  .id-row .code{
    font-size:20px; font-weight:700; letter-spacing:2px;
    color:var(--accent);
    flex:1; word-break:break-all;
  }
  .icon-btn{
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); width:34px; height:34px; border-radius:8px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:0.15s;
  }
  .icon-btn:hover{border-color:var(--accent); color:var(--accent);}
  .divider{
    display:flex; align-items:center; gap:10px;
    color:var(--text-dim); font-size:11px; text-transform:uppercase;
    letter-spacing:1px; margin:18px 0;
  }
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}
  input[type=text]{
    width:100%; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); padding:13px 14px; border-radius:10px; font-size:15px;
    outline:none; transition:0.15s;
  }
  input[type=text]:focus{border-color:var(--accent);}
  input[type=text]::placeholder{color:var(--text-dim);}
  button.primary{
    width:100%; margin-top:12px;
    background:var(--accent);
    border:none; color:rgb(var(--accent-contrast-rgb)); font-weight:700; font-size:14px;
    padding:13px; border-radius:10px; cursor:pointer;
    transition:0.15s; letter-spacing:0.3px;
  }
  button.primary:hover{opacity:0.9; transform:translateY(-1px);}
  button.primary:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  #lobby-msg{font-size:12.5px; margin-top:12px; text-align:center; min-height:16px;}
  #lobby-msg.err{color:var(--err);}
  #lobby-msg.ok{color:var(--ok);}

  #chat{flex:1; display:none; flex-direction:column; min-height:0; position:relative;}

  #chatTopBar{
    display:flex; align-items:center; justify-content:space-between;
    gap:0.5em; padding:0.5em 0.7em;
    border-bottom:1px solid var(--line);
    background:rgba(var(--bg-rgb), calc(var(--panel-alpha) * 0.7));
    backdrop-filter: blur(var(--panel-blur));
    -webkit-backdrop-filter: blur(var(--panel-blur));
    flex-shrink:0;
  }
  #roomCodeBox{
    display:flex; flex-direction:column; min-width:0; flex:1;
  }
  #roomInfoLine{
    display:flex; align-items:center; gap:0.35em; min-width:0;
  }
  #roomNameText{
    font-size:0.85rem; font-weight:700; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:7.5em;
    flex-shrink:1;
  }
  #roomInfoSep{
    color:var(--text-dim); font-size:0.75rem; flex-shrink:0;
  }
  #roomCodeText{
    font-size:0.68rem; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:6.5em;
    flex-shrink:1;
  }
  .copy-mini{
    width:1.9em; height:1.9em; flex-shrink:0;
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); border-radius:0.5em; font-size:0.85rem;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .copy-mini:hover{border-color:var(--accent); color:var(--accent);}

  /* badge discreto: pontinho de conexão + quantos players estão na sala */
  #topInfo{
    display:flex; align-items:center; gap:0.35em; flex-shrink:0;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:1em;
    padding:0.25em 0.6em;
    font-size:0.62rem;
    color:var(--text-dim);
  }
  #statusDot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-dim); flex-shrink:0;
  }
  #statusDot.online{background:var(--ok); box-shadow:0 0 6px var(--ok);}

  #typingIndicator{
    min-height:0;
    padding:0 1.1em;
    font-size:0.68rem;
    color:var(--text-dim);
    font-style:italic;
    overflow:hidden;
    max-height:0;
    transition:max-height 0.15s ease, padding 0.15s ease;
  }
  #typingIndicator.show{
    max-height:1.4em;
    padding:0.2em 1.1em;
  }

  #messages{
    flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px;
  }
  .bubble{
    max-width:78%;
    padding:0.55em 0.8em;
    border-radius:0.9em;
    font-size:0.95rem;
    line-height:1.4; word-wrap:break-word; white-space:pre-wrap;
  }
  .sender-name{
    font-size:0.85rem;
    font-weight:700;
    margin-right:0.4em;
    opacity:0.85;
    letter-spacing:0.2px;
  }
  .bubble.me .sender-name{color:rgba(var(--accent-contrast-rgb),0.75);}
  .bubble.them .sender-name{color:var(--accent);}
  .bubble.me{
    align-self:flex-end;
    background:var(--accent);
    color:rgb(var(--accent-contrast-rgb)); font-weight:500;
    border-bottom-right-radius:4px;
  }
  .bubble.them{
    align-self:flex-start;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.sys{
    align-self:center; background:transparent; color:var(--text-dim);
    font-size:12px; padding:4px;
  }
  .time{font-size:0.62rem; opacity:0.55; margin-left:0.5em; white-space:nowrap;}

  #composer{
    display:flex; gap:0.6em;
    padding:0.7em;
    border-top:1px solid var(--line);
    background:rgba(var(--bg-rgb), calc(var(--panel-alpha) * 0.75));
    backdrop-filter: blur(var(--panel-blur));
    -webkit-backdrop-filter: blur(var(--panel-blur));
    flex-shrink:0;
  }
  #msgInput{
    flex:1; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text);
    padding:0.65em 0.9em;
    border-radius:1.6em;
    font-size:0.95rem;
    outline:none;
    min-width:0;
  }
  #msgInput:focus{border-color:var(--accent);}
  #sendBtn, #leaveBtn, #resizeBtn{
    width:2.6em; height:2.6em;
    font-size:1rem;
    border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #resizeBtn{
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text-dim); cursor:grab; touch-action:none;
  }
 #sendBtn{
    border:none;
    background:var(--accent);
    color:rgb(var(--accent-contrast-rgb)); cursor:pointer;
  }
  #sendBtn:hover{opacity:0.9;}
  #leaveBtn{
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text-dim); cursor:pointer;
  }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}

  .name-field{margin-bottom:14px;}

  /* ---------- abas do lobby ---------- */
  .tabs{
    display:flex; gap:8px; margin-bottom:20px;
  }
  .tab-btn{
    flex:1; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text-dim); padding:9px; border-radius:8px;
    font-size:12.5px; font-weight:600; cursor:pointer; transition:0.15s;
  }
  .tab-btn.active{
    color:var(--text); border-color:var(--accent);
    background:rgba(var(--accent-rgb),0.14);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---------- salas (minhas / outras) ---------- */
  #recentRoomsSection{margin-top:20px;}
  .room-subheader{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.8px;
    color:var(--text-dim); margin:12px 0 8px; font-weight:700;
  }
  .recent-room-item{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-elevated); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; margin-bottom:8px;
  }
  .sala-info{flex:1; min-width:0;}
  .sala-nome-row{display:flex; align-items:center; gap:6px; min-width:0;}
  .sala-nome-row .code{
    font-size:12.5px; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .sala-codigo-sub{
    display:block; font-size:10px; color:var(--text-dim); margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .edit-sala-btn{
    background:transparent; border:none; color:var(--text-dim);
    cursor:pointer; font-size:12px; padding:2px; flex-shrink:0;
    line-height:1;
  }
  .edit-sala-btn:hover{color:var(--accent);}
  .sala-nome-edit-input{
    flex:1; min-width:0; font-size:12.5px;
    background:var(--bg-panel); border:1px solid var(--accent);
    border-radius:6px; padding:4px 6px; color:var(--text); outline:none;
  }
  .recent-room-item button.btn-entrar,
  .recent-room-item button.btn-remover{
    border:none; border-radius:7px; cursor:pointer; font-size:11.5px;
    padding:6px 10px; font-weight:700; flex-shrink:0;
  }
  .recent-room-item .btn-entrar{
    background:var(--accent);
    color:#fff;
  }
  .recent-room-item .btn-remover{
    background:transparent; color:var(--text-dim); padding:6px 8px;
  }

  /* ---------- aba de aparência ---------- */
  .appearance-field{margin-bottom:20px;}
  .appearance-field label{
    display:block; font-size:12px; color:var(--text-dim); margin-bottom:8px;
  }
  .color-item span{display:block; font-size:11px; color:var(--text-dim); margin-bottom:8px;}
  .accent-preview-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .accent-preview{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    border:2px solid var(--line); background:var(--accent);
  }
  .color-swatches{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:8px;}
  .swatch{
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    cursor:pointer; border:2px solid var(--line);
    box-shadow:none; transition:0.12s;
  }
  .swatch.selected{
    border-color:var(--text);
    box-shadow:0 0 0 2px var(--bg-panel), 0 0 0 4px var(--accent);
  }
  .hex-input{
    width:100%; background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text); padding:9px 11px; border-radius:8px;
    font-size:12.5px; outline:none;
  }
  .hex-input:focus{border-color:var(--accent);}
  .range-row{display:flex; align-items:center; gap:10px;}
  input[type=range]{
    flex:1; accent-color:var(--accent); cursor:pointer;
  }
  .range-value{font-size:12px; color:var(--text-dim); min-width:38px; text-align:right;}
  #resetAparenciaBtn{
    width:100%; margin-top:4px;
    background:var(--bg-elevated); border:1px solid var(--line);
    color:var(--text-dim); padding:10px; border-radius:10px;
    font-size:12.5px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <h1>Link<span>Chat</span></h1>
  <div class="status-pill" id="statusPill"><span class="led"></span><span id="statusText">desconectado</span></div>
</header>

<div id="lobby">
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="entrar" type="button">Entrar</button>
      <button class="tab-btn" data-tab="aparencia" type="button">Aparência</button>
    </div>

    <div class="tab-panel active" id="tabEntrar">
      <p class="sub">Crie uma sala e compartilhe o código com a outra pessoa, ou cole o código dela abaixo para entrar direto na conversa.</p>

      <div class="name-field">
        <input type="text" id="nameInput" placeholder="Seu nome" autocomplete="off" maxlength="20">
      </div>

      <div class="name-field">
        <input type="text" id="roomNameInput" placeholder="Nome da sala (opcional)" autocomplete="off" maxlength="24">
      </div>

      <button class="primary" id="createBtn" style="background:var(--bg-elevated); color:var(--text); border:1px solid var(--line);">Criar nova sala</button>

      <div class="divider">ou entre com um código</div>

      <input type="text" id="joinInput" placeholder="Cole o código da outra pessoa aqui" class="mono" autocomplete="off">
      <button class="primary" id="joinBtn">Conectar</button>
      <div id="lobby-msg"></div>

      <div id="recentRoomsSection" style="display:none;">
        <div class="divider" style="margin-top:4px;">salas</div>
        <div id="minhasSalasWrap" style="display:none;">
          <div class="room-subheader">Minhas salas</div>
          <div id="minhasSalasList"></div>
        </div>
      </div>
    </div>

    <div class="tab-panel" id="tabAparencia">
      <p class="sub">Personalize a cor de destaque e a transparência do painel. Fica salvo só neste aparelho.</p>

      <div class="appearance-field">
        <label>Cor de destaque</label>
        <div class="accent-preview-row">
          <div class="accent-preview" id="accentPreview"></div>
          <input type="text" class="hex-input mono" id="corAccentHex" maxlength="7" placeholder="#c80000" style="flex:1;">
        </div>
        <div class="color-swatches" id="corAccentSwatches"></div>
      </div>

      <div class="appearance-field">
        <label>Opacidade do fundo</label>
        <div class="range-row">
          <input type="range" id="opacidadeRange" min="40" max="100" step="1" value="94">
          <span class="range-value" id="opacidadeValue">94%</span>
        </div>
      </div>

      <div class="appearance-field">
        <label>Nível de borrão</label>
        <div class="range-row">
          <input type="range" id="borraoRange" min="0" max="24" step="1" value="8">
          <span class="range-value" id="borraoValue">8px</span>
        </div>
      </div>

      <button id="resetAparenciaBtn" type="button">Restaurar padrão</button>
    </div>
  </div>
</div>

<div id="chat">
  <div id="chatTopBar">
    <div id="roomCodeBox">
      <div id="roomInfoLine">
        <span id="roomNameText" class="mono"></span>
        <span id="roomInfoSep">·</span>
        <span id="roomCodeText" class="mono"></span>
        <button id="copyRoomBtn" class="copy-mini" title="Copiar código">⧉</button>
      </div>
    </div>
    <div id="topInfo">
      <span id="statusDot"></span>
      <span id="onlineCount">1 online</span>
    </div>
  </div>
  <div id="messages"></div>
  <div id="typingIndicator"></div>
  <div id="composer">
    <button id="leaveBtn" title="Sair da sala">←</button>
    <input type="text" id="msgInput" placeholder="Digite uma mensagem..." autocomplete="off">
    <button id="resizeBtn" title="Arraste para redimensionar">⤡</button>
    <button id="sendBtn">➤</button>
   </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy,
    onSnapshot, serverTimestamp, doc, setDoc, getDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBPu8k092E2szSImoMMgi7s6W_qjlBvv2A",
    authDomain: "linkchat-b1007.firebaseapp.com",
    projectId: "linkchat-b1007",
    storageBucket: "linkchat-b1007.firebasestorage.app",
    messagingSenderId: "435176237595",
    appId: "1:435176237595:web:f1d8cdb4ba9e1cb53c26be"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const statusDot = document.getElementById('statusDot');
  const onlineCountEl = document.getElementById('onlineCount');
  const typingIndicatorEl = document.getElementById('typingIndicator');
  const nameInput = document.getElementById('nameInput');
  const roomNameInput = document.getElementById('roomNameInput');
  const roomNameText = document.getElementById('roomNameText');
  const roomCodeText = document.getElementById('roomCodeText');
  const copyRoomBtn = document.getElementById('copyRoomBtn');
  const createBtn = document.getElementById('createBtn');
  const joinInput = document.getElementById('joinInput');
  const joinBtn = document.getElementById('joinBtn');
  const lobbyMsg = document.getElementById('lobby-msg');
  const lobby = document.getElementById('lobby');
  const chatEl = document.getElementById('chat');
  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const leaveBtn = document.getElementById('leaveBtn');

  // abas do lobby
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabPanels = { entrar: document.getElementById('tabEntrar'), aparencia: document.getElementById('tabAparencia') };

  // salas recentes
  const recentRoomsSection = document.getElementById('recentRoomsSection');
  const minhasSalasWrap = document.getElementById('minhasSalasWrap');
  const minhasSalasList = document.getElementById('minhasSalasList');

  // aparência
  const corAccentSwatches = document.getElementById('corAccentSwatches');
  const corAccentHex = document.getElementById('corAccentHex');
  const accentPreview = document.getElementById('accentPreview');
  const opacidadeRange = document.getElementById('opacidadeRange');
  const opacidadeValue = document.getElementById('opacidadeValue');
  const borraoRange = document.getElementById('borraoRange');
  const borraoValue = document.getElementById('borraoValue');
  const resetAparenciaBtn = document.getElementById('resetAparenciaBtn');

  const mySenderId = 'u-' + Math.random().toString(36).slice(2, 10);
  let roomCode = null;
  let roomNomeAtual = '';
  let unsubscribe = null;
  let unsubscribePresence = null;
  let unsubscribeTyping = null;
  let unsubscribeRoomDoc = null;
  let presencaInterval = null;
  let typingTimeout = null;
  let meuNome = '';

  // ponte com o app Android: avisa quando entra/sai da sala pra ele
  // trocar entre tela cheia (lobby) e painel flutuante (chat)
  function avisarAndroidEntrouSala(code){
    if(window.Android && typeof window.Android.onEntrouSala === 'function'){
      try{ window.Android.onEntrouSala(code); }catch(e){}
    }
  }
  function avisarAndroidSaiuDaSala(){
    if(window.Android && typeof window.Android.onSaiuDaSala === 'function'){
      try{ window.Android.onSaiuDaSala(); }catch(e){}
    }
  }

  // ---------- escala dinâmica de texto ----------
  // em vez de vw/clamp (que não reage ao tamanho real do painel dentro do
  // app Android), medimos o tamanho real do documento e ajustamos o
  // font-size da raiz. Tudo que usa rem/em escala junto automaticamente.
  function ajustarEscala(){
    const largura = document.documentElement.clientWidth || window.innerWidth;
    const min = 140, max = 430;      // faixa de largura esperada do painel
    const fonteMin = 9, fonteMax = 16; // faixa de tamanho de fonte em px
    const w = Math.max(min, Math.min(max, largura));
    const fonte = fonteMin + (fonteMax - fonteMin) * (w - min) / (max - min);
    document.documentElement.style.fontSize = fonte.toFixed(2) + 'px';
  }
  ajustarEscala();
  window.addEventListener('resize', ajustarEscala);
  if(window.ResizeObserver){
    new ResizeObserver(ajustarEscala).observe(document.documentElement);
  }

  function shortCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for(let i=0;i<8;i++){
      if(i===4) s+='-';
      s += chars[Math.floor(Math.random()*chars.length)];
    }
    return 'lc-' + s;
  }

  // copia o texto pra área de transferência. WebView do Android geralmente
  // não implementa (ou bloqueia) a Clipboard API moderna sem permissão
  // explícita, então usamos execCommand como caminho principal de fallback.
  function copiarTexto(texto){
    return new Promise((resolve, reject)=>{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texto).then(resolve).catch(()=>{
          copiarViaExecCommand(texto) ? resolve() : reject(new Error('falhou'));
        });
      }else{
        copiarViaExecCommand(texto) ? resolve() : reject(new Error('falhou'));
      }
    });
  }

  function copiarViaExecCommand(texto){
    try{
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      console.error(e);
      return false;
    }
  }

  // ---------- abas do lobby ----------
  tabBtns.forEach((btn)=>{
    btn.addEventListener('click', ()=>{
      tabBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(tabPanels).forEach(p=>p.classList.remove('active'));
      tabPanels[btn.dataset.tab].classList.add('active');
    });
  });

  // ---------- aparência personalizável (salva só neste aparelho) ----------
  // Cor única e fixa (sem degradê, sem cor primária/secundária separadas)
  const APARENCIA_PADRAO = { accent:'#c80000', opacidade:94, borrao:8 };
  const CHAVE_APARENCIA = 'linkchat_aparencia';
  const PALETA_CORES = [
    '#c80000', // vermelho
    '#16a34a', // verde
    '#eab308', // amarelo
    '#2563eb', // azul
    '#ec4899', // rosa
    '#000000', // preto
    '#ffffff'  // branco
  ];

  function hexParaRgb(hex){
    const limpo = hex.replace('#', '');
    const r = parseInt(limpo.substring(0,2), 16);
    const g = parseInt(limpo.substring(2,4), 16);
    const b = parseInt(limpo.substring(4,6), 16);
    return r + ',' + g + ',' + b;
  }

 // decide se o texto em cima da cor escolhida deve ser preto ou branco,
  // pra nunca ficar invisível (ex: branco e amarelo pedem texto preto)
  function calcularContraste(hex){
    const r = parseInt(hex.substring(1,3),16);
    const g = parseInt(hex.substring(3,5),16);
    const b = parseInt(hex.substring(5,7),16);
    const luminancia = (0.299*r + 0.587*g + 0.114*b) / 255;
    return luminancia > 0.6 ? '0,0,0' : '255,255,255';
  }

  function montarPaleta(container, aoEscolher){
    container.innerHTML = '';
    PALETA_CORES.forEach((cor)=>{
      const sw = document.createElement('div');
      sw.className = 'swatch';
      sw.style.background = cor;
      sw.dataset.cor = cor;
      sw.addEventListener('click', ()=> aoEscolher(cor));
      container.appendChild(sw);
    });
  }
  montarPaleta(corAccentSwatches, (cor)=> atualizarAparencia('accent', cor));

  function marcarSwatchSelecionado(container, corAtual){
    container.querySelectorAll('.swatch').forEach((sw)=>{
      sw.classList.toggle('selected', sw.dataset.cor.toLowerCase() === corAtual.toLowerCase());
    });
  }

  function corHexValida(valor){
    return /^#[0-9a-fA-F]{6}$/.test(valor);
  }

  function carregarAparencia(){
    try{
      const salvo = localStorage.getItem(CHAVE_APARENCIA);
      if(salvo) return Object.assign({}, APARENCIA_PADRAO, JSON.parse(salvo));
    }catch(e){ console.error(e); }
    return Object.assign({}, APARENCIA_PADRAO);
  }

  function salvarAparencia(config){
    try{ localStorage.setItem(CHAVE_APARENCIA, JSON.stringify(config)); }catch(e){ console.error(e); }
  }

  function aplicarAparencia(config){
    document.documentElement.style.setProperty('--accent', config.accent);
    document.documentElement.style.setProperty('--accent-rgb', hexParaRgb(config.accent));
    document.documentElement.style.setProperty('--accent-contrast-rgb', calcularContraste(config.accent));
    document.documentElement.style.setProperty('--panel-alpha', (config.opacidade / 100).toFixed(2));
    document.documentElement.style.setProperty('--panel-blur', config.borrao + 'px');

    marcarSwatchSelecionado(corAccentSwatches, config.accent);
    corAccentHex.value = config.accent;
    accentPreview.style.background = config.accent;

    opacidadeRange.value = config.opacidade;
    opacidadeValue.textContent = config.opacidade + '%';
    borraoRange.value = config.borrao;
    borraoValue.textContent = config.borrao + 'px';

    // avisa o app Android pra deixar o fundo nativo do painel condizente
    // (deixa o painel realmente translúcido, não só o conteúdo da web)
    if(window.Android && typeof window.Android.onOpacidadeAlterada === 'function'){
      try{ window.Android.onOpacidadeAlterada(config.opacidade); }catch(e){}
    }

    // avisa o app Android da cor de destaque atual, pra elementos nativos
    // (como o botão de fechar ✕) acompanharem a mesma cor escolhida aqui
    if(window.Android && typeof window.Android.onCorDestaqueAlterada === 'function'){
      try{ window.Android.onCorDestaqueAlterada(config.accent); }catch(e){}
    }
  }

  let aparenciaAtual = carregarAparencia();
  aplicarAparencia(aparenciaAtual);

  function atualizarAparencia(campo, valor){
    aparenciaAtual[campo] = valor;
    aplicarAparencia(aparenciaAtual);
    salvarAparencia(aparenciaAtual);
  }

  corAccentHex.addEventListener('input', ()=>{
    if(corHexValida(corAccentHex.value)) atualizarAparencia('accent', corAccentHex.value);
  });
 opacidadeRange.addEventListener('input', ()=> atualizarAparencia('opacidade', Number(opacidadeRange.value)));
  borraoRange.addEventListener('input', ()=> atualizarAparencia('borrao', Number(borraoRange.value)));
  resetAparenciaBtn.addEventListener('click', ()=>{
    aparenciaAtual = Object.assign({}, APARENCIA_PADRAO);
    aplicarAparencia(aparenciaAtual);
    salvarAparencia(aparenciaAtual);
  });

  // ---------- nome salvo (pra não precisar digitar de novo toda vez) ----------
  const CHAVE_NOME = 'linkchat_nome';

  function carregarNomeSalvo(){
    try{ return localStorage.getItem(CHAVE_NOME) || ''; }catch(e){ return ''; }
  }

  function salvarNome(nome){
    try{ localStorage.setItem(CHAVE_NOME, nome); }catch(e){ console.error(e); }
  }

  nameInput.value = carregarNomeSalvo();
  nameInput.addEventListener('input', ()=> salvarNome(nameInput.value.trim()));

  // ---------- minhas salas (histórico local — código já é a chave, sem senha) ----------
  const CHAVE_SALAS = 'linkchat_salas_recentes';
  const MAX_SALAS_RECENTES = 8;

  function carregarSalasRecentes(){
    try{
      const salvo = localStorage.getItem(CHAVE_SALAS);
      return salvo ? JSON.parse(salvo) : [];
    }catch(e){ return []; }
  }

  function salvarSalaRecente(code, nome){
    let salas = carregarSalasRecentes().filter(s => s.code !== code);
    const anterior = carregarSalasRecentes().find(s => s.code === code);
    const nomeFinal = (nome !== undefined) ? nome : ((anterior && anterior.nome) || '');
    salas.unshift({ code: code, nome: nomeFinal, ultimaVez: Date.now() });
    salas = salas.slice(0, MAX_SALAS_RECENTES);
    try{ localStorage.setItem(CHAVE_SALAS, JSON.stringify(salas)); }catch(e){ console.error(e); }
    renderizarListaSalas();
  }

  function removerSalaRecente(code){
    const salas = carregarSalasRecentes().filter(s => s.code !== code);
    try{ localStorage.setItem(CHAVE_SALAS, JSON.stringify(salas)); }catch(e){ console.error(e); }
    renderizarListaSalas();
  }

  // atualiza o nome de uma sala no Firebase + no histórico local. Se for a
  // sala aberta no momento, atualiza também o cabeçalho do chat.
  async function atualizarNomeSala(code, novoNome){
    try{
      await setDoc(doc(db, 'rooms', code), { nome: novoNome }, { merge: true });
      salvarSalaRecente(code, novoNome);
      if(code === roomCode){
        roomNomeAtual = novoNome;
        roomNameText.textContent = novoNome || code;
      }
      return true;
    }catch(e){
      console.error(e);
      addSystemMsgSeAberta('Não foi possível salvar o nome da sala. Verifique sua internet.');
      return false;
    }
  }

  function addSystemMsgSeAberta(texto){
    if(chatEl.style.display === 'flex') addSystemMsg(texto);
  }

  // ---------- minhas salas ----------
  // por segurança, só existe a lista das salas que a própria pessoa criou ou
  // entrou (salva localmente). Não há mais lista pública de todas as salas —
  // entrar numa sala exige que alguém te repasse o código. O nome da sala é
  // editado direto aqui na lista, não dentro da conversa.
  function renderizarListaSalas(){
    const minhasSalas = carregarSalasRecentes();

    const temAlgo = minhasSalas.length > 0;
    recentRoomsSection.style.display = temAlgo ? 'block' : 'none';
    minhasSalasWrap.style.display = temAlgo ? 'block' : 'none';
    if(!temAlgo) return;

    minhasSalasList.innerHTML = '';
    minhasSalas.forEach((sala, index)=>{
      const item = document.createElement('div');
      item.className = 'recent-room-item';

      const infoWrap = document.createElement('div');
      infoWrap.className = 'sala-info';

      const nomeRow = document.createElement('div');
      nomeRow.className = 'sala-nome-row';

      const nomeSpan = document.createElement('span');
      nomeSpan.className = 'code mono';
      nomeSpan.textContent = sala.nome || sala.code;
      if(index === 0){
      const badgeRecente = document.createElement('span');
      badgeRecente.textContent = 'recente';
      badgeRecente.style.cssText = 'font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px;flex-shrink:0;';
      nomeRow.appendChild(badgeRecente);
      }
      
      nomeRow.appendChild(nomeSpan);

      const btnEditar = document.createElement('button');
      btnEditar.className = 'edit-sala-btn';
      btnEditar.type = 'button';
      btnEditar.textContent = '✎';
      btnEditar.title = 'Editar nome da sala';
      btnEditar.addEventListener('click', (e)=>{
        e.stopPropagation();
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'sala-nome-edit-input mono';
        input.maxLength = 24;
        input.value = sala.nome || '';
        input.placeholder = sala.code;
        nomeRow.replaceChild(input, nomeSpan);
        btnEditar.style.display = 'none';
        input.focus();
        input.select();

        let jaSalvou = false;
        function confirmar(){
          if(jaSalvou) return;
          jaSalvou = true;
          atualizarNomeSala(sala.code, input.value.trim());
        }
        input.addEventListener('keydown', (ev)=>{ if(ev.key === 'Enter') confirmar(); });
        input.addEventListener('blur', confirmar);
      });
      nomeRow.appendChild(btnEditar);

      infoWrap.appendChild(nomeRow);

      const codigoSpan = document.createElement('span');
      codigoSpan.className = 'mono sala-codigo-sub';
      codigoSpan.textContent = sala.code;
      infoWrap.appendChild(codigoSpan);

      item.appendChild(infoWrap);

      const btnEntrar = document.createElement('button');
      btnEntrar.className = 'btn-entrar';
      btnEntrar.textContent = 'Entrar';
      btnEntrar.addEventListener('click', ()=> entrarPorSalaRecente(sala.code));
      item.appendChild(btnEntrar);

      const btnRemover = document.createElement('button');
      btnRemover.className = 'btn-remover';
      btnRemover.textContent = '✕';
      btnRemover.title = 'Remover da lista';
      btnRemover.addEventListener('click', ()=> removerSalaRecente(sala.code));
      item.appendChild(btnRemover);

      minhasSalasList.appendChild(item);
    });
  }

  async function entrarPorSalaRecente(code){
    if(!nomeValido()) return;
    showLobbyMsg('Verificando sala...', '');
    try{
      const snap = await getDoc(doc(db, 'rooms', code));
      if(!snap.exists()){
        showLobbyMsg('Essa sala não existe mais.', 'err');
        removerSalaRecente(code);
        return;
      }
      salvarSalaRecente(code, snap.data().nome);
      entrarNaSala(code);
    }catch(e){
      console.error(e);
      showLobbyMsg('Erro ao conectar. Verifique sua internet.', 'err');
    }
  }


  renderizarListaSalas();

  function setStatus(online, text){
    statusDot.classList.toggle('online', online);
    statusDot.title = text; // aparece só ao passar o mouse/dedo por cima
  }

  function showLobbyMsg(text, type){
    lobbyMsg.textContent = text;
    lobbyMsg.className = type || '';
  }

  function nomeValido(){
    const nome = nameInput.value.trim();
    if(!nome){
      showLobbyMsg('Digite seu nome antes de continuar.', 'err');
      nameInput.focus();
      return false;
    }
    meuNome = nome;
    salvarNome(nome);
    return true;
  }

  createBtn.addEventListener('click', async ()=>{
    if(!nomeValido()) return;
    const code = shortCode();
    const nomeDaSala = roomNameInput.value.trim();
    createBtn.disabled = true;
    createBtn.textContent = 'Criando...';
    try{
      await setDoc(doc(db, 'rooms', code), { createdAt: serverTimestamp(), nome: nomeDaSala || '' });
      salvarSalaRecente(code, nomeDaSala);
      entrarNaSala(code);
      showLobbyMsg('Sala criada!', 'ok');
    }catch(e){
      console.error(e);
      showLobbyMsg('Erro ao criar sala. Verifique sua internet.', 'err');
    }
    createBtn.disabled = false;
    createBtn.textContent = 'Criar nova sala';
  });

  copyRoomBtn.addEventListener('click', ()=>{
    if(!roomCode) return;
    copiarTexto(roomCode).then(()=>{
      copyRoomBtn.textContent = '✓';
      setTimeout(()=>copyRoomBtn.textContent='⧉', 1200);
    }).catch(()=>{
      addSystemMsg('Não foi possível copiar automaticamente. Código: ' + roomCode);
    });
  });

  joinBtn.addEventListener('click', async ()=>{
    if(!nomeValido()) return;
    const targetCode = joinInput.value.trim();
    if(!targetCode){ showLobbyMsg('Cole um código antes de conectar.', 'err'); return; }
    joinBtn.disabled = true;
    joinBtn.textContent = 'Conectando...';
    showLobbyMsg('Verificando sala...', '');
    try{
      const roomRef = doc(db, 'rooms', targetCode);
      const snap = await getDoc(roomRef);
      if(!snap.exists()){
        showLobbyMsg('Sala não encontrada. Confira o código.', 'err');
        joinBtn.disabled = false;
        joinBtn.textContent = 'Conectar';
        return;
      }
      salvarSalaRecente(targetCode, snap.data().nome);
      entrarNaSala(targetCode);
    }catch(e){
      console.error(e);
      showLobbyMsg('Erro ao conectar. Verifique sua internet.', 'err');
      joinBtn.disabled = false;
      joinBtn.textContent = 'Conectar';
    }
  });

  joinInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') joinBtn.click(); });

  function entrarNaSala(code){
    roomCode = code;
    lobby.style.display = 'none';
    chatEl.style.display = 'flex';
    roomCodeText.textContent = code;
    roomNameText.textContent = code;
    roomNameInput.value = '';
    setStatus(true, 'conectado');
    messagesEl.innerHTML = '';
    
    avisarAndroidEntrouSala(code);

    // acompanha o nome da sala em tempo real (reflete edições feitas por
    // qualquer uma das duas pessoas na conversa, inclusive pela lista de salas)
    unsubscribeRoomDoc = onSnapshot(doc(db, 'rooms', code), (snap)=>{
      const nome = snap.exists() ? (snap.data().nome || '') : '';
      roomNomeAtual = nome;
      roomNameText.textContent = nome || code;
      salvarSalaRecente(code, nome);
    });

    const messagesRef = collection(db, 'rooms', code, 'messages');
    const q = query(messagesRef, orderBy('createdAt', 'asc'));

    unsubscribe = onSnapshot(q, (snapshot)=>{
      messagesEl.querySelectorAll('.bubble.me, .bubble.them').forEach(b => b.remove());
      snapshot.forEach((docSnap)=>{
        const data = docSnap.data();
        const who = data.sender === mySenderId ? 'me' : 'them';
        addBubble(data.text, who, data.createdAt, data.senderName);
      });
    }, (error)=>{
      console.error(error);
      addSystemMsg('Conexão perdida. Verifique sua internet.');
    });

    // ---------- presença (quantos players online) ----------
    async function atualizarPresenca(){
      try{
        await setDoc(doc(db, 'rooms', code, 'presence', mySenderId), {
          name: meuNome, lastSeen: serverTimestamp()
        });
      }catch(e){ console.error(e); }
    }
    atualizarPresenca();
    presencaInterval = setInterval(atualizarPresenca, 12000);

    const presenceRef = collection(db, 'rooms', code, 'presence');
    unsubscribePresence = onSnapshot(presenceRef, (snap)=>{
      const agora = Date.now();
      let online = 0;
      snap.forEach((d)=>{
        const data = d.data();
        if(data.lastSeen && data.lastSeen.toMillis && (agora - data.lastSeen.toMillis() < 25000)){
          online++;
        }
      });
      onlineCountEl.textContent = Math.max(online, 1) + ' online';
    });

    // ---------- indicador de "digitando..." ----------
    const typingRef = collection(db, 'rooms', code, 'typing');
    unsubscribeTyping = onSnapshot(typingRef, (snap)=>{
      const agora = Date.now();
      const nomes = [];
      snap.forEach((d)=>{
        if(d.id === mySenderId) return;
        const data = d.data();
        if(data.typingAt && data.typingAt.toMillis && (agora - data.typingAt.toMillis() < 4000)){
          nomes.push(data.name || 'Alguém');
        }
      });
      if(nomes.length === 0){
        typingIndicatorEl.classList.remove('show');
        typingIndicatorEl.textContent = '';
      }else{
        typingIndicatorEl.textContent = nomes.join(', ') + (nomes.length === 1 ? ' está digitando…' : ' estão digitando…');
        typingIndicatorEl.classList.add('show');
      }
    });
  }

  function sairDaSala(){
    const codigoSaindo = roomCode;
    if(unsubscribe) unsubscribe();
    if(unsubscribePresence) unsubscribePresence();
    if(unsubscribeTyping) unsubscribeTyping();
    if(unsubscribeRoomDoc) unsubscribeRoomDoc();
    if(presencaInterval) clearInterval(presencaInterval);
    clearTimeout(typingTimeout);
    if(codigoSaindo){
      deleteDoc(doc(db, 'rooms', codigoSaindo, 'presence', mySenderId)).catch(()=>{});
      deleteDoc(doc(db, 'rooms', codigoSaindo, 'typing', mySenderId)).catch(()=>{});
    }
    roomCode = null;
    roomNomeAtual = '';
    chatEl.style.display = 'none';
    lobby.style.display = 'flex';
    setStatus(false, 'desconectado');
    joinInput.value = '';
    showLobbyMsg('', '');
    typingIndicatorEl.classList.remove('show');
    avisarAndroidSaiuDaSala();
  }

  // segurança extra: se a página fechar de vez com sala aberta, tenta limpar a presença
  window.addEventListener('pagehide', ()=>{
    if(roomCode){
      try{ deleteDoc(doc(db, 'rooms', roomCode, 'presence', mySenderId)); }catch(e){}
    }
  });

  leaveBtn.addEventListener('click', sairDaSala);

  function addBubble(text, who, timestamp, senderName){
    const b = document.createElement('div');
    b.className = 'bubble ' + who;
    let time = '';
    if(timestamp && timestamp.toDate){
      const d = timestamp.toDate();
      time = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }
    const nomeExibido = who === 'me' ? 'Você' : (senderName || 'Anônimo');
    b.innerHTML =
      '<span class="sender-name">' + escapeHtml(nomeExibido) + '</span>' +
      '<span class="msg-text">' + escapeHtml(text) + '</span>' +
      (time ? '<span class="time">'+time+'</span>' : '');
    messagesEl.appendChild(b);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemMsg(text){
    const b = document.createElement('div');
    b.className = 'bubble sys';
    b.textContent = text;
    messagesEl.appendChild(b);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || !roomCode) return;
    msgInput.value = '';
    clearTimeout(typingTimeout);
    deleteDoc(doc(db, 'rooms', roomCode, 'typing', mySenderId)).catch(()=>{});
    try{
      const messagesRef = collection(db, 'rooms', roomCode, 'messages');
      await addDoc(messagesRef, {
        text: text,
        sender: mySenderId,
        senderName: meuNome,
        createdAt: serverTimestamp()
      });
    }catch(e){
      console.error(e);
      addSystemMsg('Falha ao enviar. Verifique sua internet.');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendMessage(); });

  msgInput.addEventListener('input', ()=>{
    if(!roomCode) return;
    setDoc(doc(db, 'rooms', roomCode, 'typing', mySenderId), {
      name: meuNome, typingAt: serverTimestamp()
    }).catch(()=>{});
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(()=>{
      deleteDoc(doc(db, 'rooms', roomCode, 'typing', mySenderId)).catch(()=>{});
    }, 2500);
  });

  // ---------- redimensionar (botão HTML, avisa o app Android) ----------
const resizeBtn = document.getElementById('resizeBtn');
let resizeAtivo = false;
let resizeX = 0, resizeY = 0;

function iniciarResize(x, y){
  resizeAtivo = true;
  resizeX = x; resizeY = y;
}
function moverResize(x, y){
  if(!resizeAtivo) return;
  const dx = x - resizeX;
  const dy = y - resizeY;
  resizeX = x; resizeY = y;
  if(window.Android && typeof window.Android.onRedimensionar === 'function'){
    try{ window.Android.onRedimensionar(dx, dy); }catch(e){}
  }
}
function pararResize(){ resizeAtivo = false; }

resizeBtn.addEventListener('touchstart', (e)=>{
  const t = e.touches[0];
  iniciarResize(t.clientX, t.clientY);
  e.preventDefault();
}, {passive:false});
resizeBtn.addEventListener('touchmove', (e)=>{
  const t = e.touches[0];
  moverResize(t.clientX, t.clientY);
  e.preventDefault();
}, {passive:false});
resizeBtn.addEventListener('touchend', pararResize);
resizeBtn.addEventListener('touchcancel', pararResize);
</script>

</body>
</html>
